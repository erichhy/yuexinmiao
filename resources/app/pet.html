<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月薪喵 · 桌面宠物</title>
<style>
  :root{
    --ink:#2b2b33; --sub:#8a8a96; --accent:#ff8aa0; --accent2:#7ec8e3;
    --size:160px;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{height:100%; margin:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:transparent; color:var(--ink); overflow:hidden;
  }
  body.preview{background:linear-gradient(135deg,#fef6f0,#eef4fb);}

  #pet{
    position:fixed; left:50%; top:60%; transform:translate(-50%,-50%);
    width:var(--size); cursor:grab; touch-action:none; z-index:50;
    transition:filter .6s, opacity .25s;
  }
  /* 全窗透明拖动层：覆盖整个宠物窗口，任意位置按下都能拖动整个桌宠；
     z-index 高于所有宠物 UI(≤55) 但低于投喂金币(.coin z:75)/逗猫棒(#laser z:76)，故后者仍可被点击 */
  #dragLayer{position:fixed; inset:0; z-index:70; pointer-events:auto; cursor:grab;}
  #dragLayer.dragging{cursor:grabbing;}
  #pet.dragging{cursor:grabbing;}
  #pet.bounce{animation:bounce .5s ease;}
  @keyframes bounce{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-62%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1)}}
  #pet.throw .frame{animation:thr .55s cubic-bezier(.3,1.4,.5,1);}
  @keyframes thr{0%{transform:translate(0,0) rotate(0)}40%{transform:translate(var(--tx,20px),var(--ty,-30px)) rotate(var(--rot,18deg)) scale(1.1)}100%{transform:translate(0,0) rotate(0)}}

  .frame{
    position:relative; width:100%; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    border-radius:24px; overflow:visible; background:transparent;
  }
  body.preview .frame{
    background:radial-gradient(circle at 50% 35%, #ffffff, #f3f3f7);
    box-shadow:0 18px 40px rgba(80,80,120,.18);
  }
  .frame img{width:100%; height:100%; object-fit:contain; display:block; image-rendering:auto;}
  .placeholder{
    width:100%; height:100%; display:flex; flex-direction:column; gap:6px;
    align-items:center; justify-content:center; text-align:center; padding:10px;
    color:var(--sub); font-size:12px; line-height:1.5;
    border:2px dashed rgba(0,0,0,.12); border-radius:24px;
  }

  /* 顶部状态条（钱包 / 心情 / 好感）：紧凑居中，紧贴猫头顶，不占满整窗 */
  #meters{ position:fixed; left:50%; top:calc(60% - var(--size)/2 - 34px); transform:translateX(-50%); z-index:55;
    display:flex; gap:4px; justify-content:center; width:auto; pointer-events:none; }
  /* 钱包/心情/好感 状态条：强制单行（不转行），避免「💰钱包 ¥520」被挤成两行后顶到左侧成就贴图 */
  .meter{flex:0 0 auto; width:66px; white-space:nowrap;}
  .meter .lab{font-size:9px; color:var(--sub); margin-bottom:2px; display:flex; justify-content:space-between; gap:3px; white-space:nowrap;}
  .meter .lab [data-v]{font-size:8px; white-space:nowrap;}
  .meter .bar{height:6px; border-radius:5px; background:rgba(0,0,0,.10); overflow:hidden;}
  .meter .fill{height:100%; border-radius:5px; transition:width .4s;}

  /* 下班倒计时小条：状态条正上方 */
  #offwork{ position:fixed; left:50%; top:calc(60% - var(--size)/2 - 62px); transform:translateX(-50%); z-index:55;
    font-size:11px; font-weight:700; color:#7a6a3a; background:rgba(255,247,225,.9);
    border:1px solid #ffe2ad; padding:3px 10px; border-radius:10px; pointer-events:none; white-space:nowrap; }

  #speech{
    position:fixed; left:50%; top:calc(60% - var(--size)/2 - 92px);
    transform:translateX(-50%); z-index:65; display:none;
    background:#fff; color:var(--ink); padding:8px 14px; border-radius:14px;
    font-size:14px; font-weight:600; box-shadow:0 8px 22px rgba(60,60,90,.18); white-space:nowrap; max-width:90vw;
  }
  #speech:after{content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:#fff; border-bottom:0;}

  #banner{
    position:fixed; top:calc(60% - var(--size)/2 - 14px); left:50%; transform:translateX(-50%);
    max-width:92vw; padding:8px 14px; z-index:70; display:none;
    background:#fff7ef; border:1px solid #ffd9b8; color:#9a5a2b;
    border-radius:14px; font-size:12px; line-height:1.5; box-shadow:0 8px 24px rgba(200,120,40,.12); text-align:center;
  }
  .heart{position:fixed; z-index:80; pointer-events:none; font-size:20px; color:var(--accent);
    animation:hp 1s ease-out forwards; text-shadow:0 2px 4px rgba(255,120,140,.4);}
  @keyframes hp{0%{opacity:1; transform:translateY(0) scale(.7)}100%{opacity:0; transform:translateY(-70px) scale(1.2)}}

  /* 接工资 / 节日：掉落硬币 & 撒花 */
  #coins{position:fixed; inset:0; z-index:75; pointer-events:none;}
  .coin{position:absolute; top:-30px; font-size:22px; pointer-events:auto; cursor:pointer;
    animation:fall linear forwards; filter:drop-shadow(0 2px 3px rgba(200,150,40,.5));}
  @keyframes fall{from{transform:translateY(0)}to{transform:translateY(105vh)}}
  #confetti{position:fixed; inset:0; z-index:78; pointer-events:none; overflow:hidden;}
  .confetti{position:absolute; top:-20px; width:10px; height:14px; border-radius:2px;
    animation:fall linear forwards; opacity:.95;}
  @keyframes confall{from{transform:translateY(0) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}

  /* 逗猫棒：跟随光点 */
  #laser{position:fixed; z-index:76; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle,#ff6b6b,#ff2d2d); box-shadow:0 0 10px #ff4d4d; display:none; pointer-events:none;}

  /* 成就贴图：好感里程碑解锁，贴在 GIF 左侧空白处（纯视觉，不穿戴） */
  #badges{position:absolute; top:50%; left:-16px; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:6px; pointer-events:none; z-index:45;}
  .badge{width:34px; height:34px; object-fit:contain; display:block;
    filter:drop-shadow(0 3px 6px rgba(60,60,90,.22)); pointer-events:auto;}

  /* 浏览器预览用的底部状态栏（exe 里隐藏） */
  #dock{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    display:none; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    max-width:96vw; padding:10px 14px; z-index:60;
    background:rgba(255,255,255,.82); border:1px solid rgba(0,0,0,.08);
    border-radius:18px; backdrop-filter:blur(14px); box-shadow:0 10px 30px rgba(60,60,90,.14);
  }
  body.preview #dock{display:flex;}
  .btn{ border:none; background:#fff; color:var(--ink); cursor:pointer;
    padding:7px 11px; border-radius:12px; font-size:13px; font-weight:600;
    box-shadow:0 2px 6px rgba(0,0,0,.06); transition:transform .12s, background .15s; }
  .btn:hover{transform:translateY(-1px);}
  .btn.active{background:var(--accent); color:#fff;}
  .btn.ghost{background:transparent; box-shadow:none; color:var(--sub);}
</style>
</head>
<body>
  <div id="dragLayer"></div>
  <div id="banner"></div>
  <div id="speech"></div>
  <div id="offwork"></div>
  <div id="meters"></div>
  <div id="coins"></div>
  <div id="confetti"></div>
  <div id="laser"></div>

  <div id="pet"><div class="frame" id="frame"></div><div id="badges"></div></div>

  <!-- 仅浏览器预览显示；exe 中操作在独立面板窗口 -->
  <div id="dock"><span id="stateBtns" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"></span></div>

<script>
  /* 依赖脚本改用「绝对 file:// 路径」加载：彻底规避中文用户名下相对路径加载失败
     （catalog.js 在 assets/yuexinmiao 下；states.js / controls.js 在应用根目录）。
     有 preload 时用已百分号编码的绝对路径；浏览器预览（无 preload）时退回相对路径。 */
  (function(){
    var APP_BASE = (window.__pet && window.__pet.appBase) || (location.href.split('/').slice(0,-1).join('/'));
    var ASSET    = (window.__pet && window.__pet.assetBase) || (APP_BASE + '/assets/yuexinmiao');
    document.write('<scr'+'ipt src="'+ASSET+'/catalog.js"></scr'+'ipt>');
    document.write('<scr'+'ipt src="'+APP_BASE+'/states.js"></scr'+'ipt>');
    document.write('<scr'+'ipt src="'+APP_BASE+'/controls.js"></scr'+'ipt>');
  })();
</script>
<script>
/* =========================================================================
   月薪喵 · 猫窗口（渲染 / 拖拽 / 状态机 / 全互动）
   数值模型：wallet(钱包) mood(心情) affinity(好感)
   · 钱包/心情共同决定「自动模式」下显示的 GIF（autoState 决策表）
   · 面板点「自动」回到数值驱动；点具体状态则强制覆盖
   · 新增：昼夜色调、节日撒花、好感成就贴图、低调省电模式、健康提醒
   ========================================================================= */
const _log = (m)=>{ try{ console.log('[pet] '+m); }catch(_){} };
window.addEventListener('error', e=>{ _log('WINDOW_ERROR '+(e.error&&e.error.stack||e.message)); });
// 可见调试框：任何关键错误直接浮在猫窗口上（红底白字），无需读日志也能看到问题
function showDebug(msg){
  try{
    let d=document.getElementById('debugbox');
    if(!d){ d=document.createElement('div'); d.id='debugbox';
      d.style.cssText='position:fixed;left:6px;top:6px;right:6px;z-index:9999;background:rgba(190,0,0,.88);color:#fff;font:12px/1.45 monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;pointer-events:none;';
      document.body.appendChild(d); }
    d.textContent += msg+'\n';
  }catch(_){}
}
// 资源目录：优先用 preload 传来的绝对（已编码）file:// 路径，彻底规避中文用户名下的相对路径加载失败
const ASSET_BASE = (window.__pet && window.__pet.assetBase) || (location.href.split('/').slice(0,-1).join('/') + '/assets/yuexinmiao');
const pathOf = file => ASSET_BASE + '/' + file;
_log('boot href='+location.href+' assetBase='+ASSET_BASE+' catalog='+(typeof GIF_CATALOG!=='undefined'?GIF_CATALOG.length:'UNDEF')+' stateLists='+(typeof stateLists!=='undefined'?Object.keys(stateLists).join(','):'UNDEF'));
if(typeof GIF_CATALOG==='undefined'){ showDebug('❌ catalog.js 未加载 → GIF_CATALOG 未定义（猫图无法显示）。请用浏览器打开 gif-check.html 验证。'); }
if(typeof stateLists==='undefined'){ showDebug('❌ states.js 未加载 → stateLists 未定义（猫图无法显示）。'); }
const $ = s=>document.querySelector(s);
const clamp = (v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const pet = $('#pet'), frame = $('#frame'), dragLayer = $('#dragLayer');

/* ---------- 持久化 ---------- */
const SAVE_KEY = 'yuexinmiao_save_v1';
function loadSave(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY))||{}; }catch(e){ return {}; } }
const saved = loadSave();
let dead = (typeof saved.dead==='boolean') ? saved.dead : false;   // 死亡态标记：为 true 时下次打开仍展示哭脸+横幅，直到“重新投胎”
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
  wallet:stats.wallet, mood:stats.mood, affinity:stats.affinity,
  lastSettle:lastSettle, lastPayday:lastPayday, lastHoliday:lastHoliday,
  lastExpenseDay:lastExpenseDay,
  lowPower:lowPower, remindMin:remindMin,
  teaserAffDate:teaserAffDate, teaserAffGain:teaserAffGain, healthEnabled:healthEnabled,
  dead:dead
})); }catch(e){} }

/* ---------- 数值 ---------- */
const stats = {
  wallet: (typeof saved.wallet==='number') ? saved.wallet : 520,   // ¥
  mood:   clamp((typeof saved.mood==='number') ? saved.mood : 75),
  affinity: clamp((typeof saved.affinity==='number') ? saved.affinity : 10),
};
let lastSettle  = saved.lastSettle  || '';   // YYYY-MM-DD（接工资日结）
let lastPayday  = saved.lastPayday  || '';   // YYYY-MM（发工资月）
let lastHoliday = saved.lastHoliday || '';   // MM-DD（已展示过的节日，避免重复撒花）
let lowPower    = (typeof saved.lowPower==='boolean') ? saved.lowPower : false;   // 低调省电模式
let healthEnabled = (typeof saved.healthEnabled==='boolean') ? saved.healthEnabled : true;  // 健康提醒总开关（喝水30分/休息1h/夜间护眼），默认开
let teaserAffDate = saved.teaserAffDate || '';   // 逗猫棒亲密度「按天」计数日期 YYYY-MM-DD
let teaserAffGain = (typeof saved.teaserAffGain==='number') ? saved.teaserAffGain : 0;   // 当天逗猫棒已涨亲密度（上限 5）

/* ---------- 破产死亡机制：每日生活开支 + 玩耍花费 + 钱包为负即死 ---------- */
const DAILY_EXPENSE = 20;    // 每日固定生活开支（跨天自动扣除）
const PLAY_COST = 50;        // 每次玩耍花费（比日常开支高，制造「要工作养猫」的压力）
let lastExpenseDay = (typeof saved.lastExpenseDay==='string') ? saved.lastExpenseDay : '';  // 上次扣生活开支的日期

function walletLevel(){ return clamp(Math.round(stats.wallet/100),0,100); } // ¥10000 -> 100
function dateStr(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthStr(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

/* =========================================================================
   钱包 / 心情 → 自动状态（核心：各种数值对应不同 GIF）
   决策优先级（从上到下）：
     1. 工资日(paydayActive) → rich   炫富/高兴
     2. 心情低 (m<25)         → sad   哭 / 难受
     3. 金钱低 (w<25)         → work  打工
     4. 金钱多 (w>=60)        → happy 休闲 / 高兴
     5. 心情好 (m>=65)        → sport 活跃（奔跑/冲刺/骑车等运动）
     6. 心情中上 (m>=40)      → happy 休闲高兴
   （已去掉「待机 idle」图：默认回落到休闲高兴）
   ========================================================================= */
const PAYDAY = 15;            // 每月发工资日（可自行改）
let paydayActive = false;
function autoState(){
  const m = stats.mood, w = walletLevel();
  if(paydayActive) return 'rich';   // 工资日：炫富彩蛋
  if(m < 25) return 'sad';          // 心情低 → 哭 / 难受
  if(w < 25) return 'work';         // 金钱低 → 打工
  if(w >= 60) return 'happy';       // 金钱多 → 休闲和高兴
  if(m >= 65) return 'sport';       // 心情好 → 活跃（运动）
  return 'happy';                   // 默认 → 休闲高兴（已去掉待机图）
}

/* ---------- 状态机 ---------- */
let forcedState = null;       // null = 自动(数值驱动)；否则面板强制
let currentState = autoState();
let currentItem = null;       // 当前显示的 GIF 元数据（用于摸摸头气泡等）
let stateIndex = {}; if(typeof STATE_ORDER!=='undefined'){ STATE_ORDER.forEach(k=>stateIndex[k]=0); } else { showDebug('❌ STATE_ORDER 未定义（states.js 未加载）。'); }
let cycleTimer = null;
let decayTimer=null, quipTimer=null, tipsTimer=null, healthTickTimer=null, hc={water:0,stand:0,rest:0,night:0};
let lockedItem = null;   // 锁定某张特定 GIF（散步/玩耍/逗猫棒），优先于状态轮播

function pickNext(state){
  const list = stateLists[state]; if(!list||!list.length) return null;
  stateIndex[state] = (stateIndex[state]+1) % list.length;
  return list[stateIndex[state]];
}
function render(item, line){
  if(!item) return;
  currentItem = item;
  frame.innerHTML = '';
  const img = document.createElement('img');
  img.alt = item.name;
  img.style.width='100%';
  img.style.height='100%';
  img.style.objectFit='contain';
  img.onload = ()=> _log('IMG_OK '+item.file);
  img.onerror = ()=>{ _log('IMG_FAIL '+item.file+' base='+ASSET_BASE); showDebug('❌ 图片加载失败: '+item.file+'\n路径: '+pathOf(item.file)); frame.innerHTML = '<div class="placeholder"><b>图片未找到</b><span style="font-size:11px">'+item.file+'</span></div>'; };
  img.src = pathOf(item.file);
  frame.appendChild(img);      // 直接挂载，不等待 onload（避免某些 GIF 解码不触发 onload 导致空白）
  if(line) say(line);
}
function say(txt, ms=1600){ const s=$('#speech'); s.textContent=txt; s.style.display='block'; clearTimeout(say._t); say._t=setTimeout(()=>s.style.display='none', ms); }
function showBanner(html, ms=3600){ const b=$('#banner'); b.innerHTML=html; b.style.display='block'; clearTimeout(showBanner._t); showBanner._t=setTimeout(()=>b.style.display='none', ms); }

function setState(key){           // 面板强制某个状态
  if(!stateLists[key]) return;
  forcedState = key; currentState = key;
  render(pickNext(key) || stateLists[key][0]);
  if(window.__pet) window.__pet.notifyStateChanged(key);
}
function setAuto(){                // 回到数值驱动
  forcedState = null; tick();
  if(window.__pet) window.__pet.notifyStateChanged('auto');
}
/* 临时状态：展示一段时间后自动回到数值驱动（用于投喂/玩耍/戳） */
let transientTimer=null;
function transientState(key, ms=1500){
  if(!stateLists[key]) return;
  forcedState = key; currentState = key;
  render(pickNext(key) || stateLists[key][0]);
  if(window.__pet) window.__pet.notifyStateChanged(key);
  clearTimeout(transientTimer);
  transientTimer = setTimeout(()=>{ if(forcedState===key){ forcedState=null; tick(); } }, ms);
}
function tick(){
  if(lockedItem){ if(currentItem!==lockedItem) render(lockedItem); currentState=lockedItem.state; return; }
  const s = forcedState || autoState();
  currentState = s;
  render(pickNext(s) || (stateLists[s] && stateLists[s][0]));
  if(window.__pet) window.__pet.notifyStateChanged(forcedState ? s : 'auto');
}
/* 数值变化时：若「自动状态」结果与当前不同，立即换图（不必等整分钟），但不打断锁定/强制/移动 */
function maybeRevealState(){
  if(dead) return;
  if(lockedItem || forcedState || walking || teaser) return;
  const s = autoState();
  if(s !== currentState){ currentState = s; render(pickNext(s) || (stateLists[s] && stateLists[s][0])); if(window.__pet) window.__pet.notifyStateChanged('auto'); }
}
/* 锁定显示某一张特定 GIF（散步/玩耍/逗猫棒用，不再在状态池里轮播） */
function setItemByFile(file, line){
  const it = GIF_CATALOG.find(x=>x.file===file);
  if(!it) return;
  lockedItem = it; render(it, line);
  if(window.__pet) window.__pet.notifyStateChanged(it.state);
}
const ROTATE_MS = 60000;          // 每 1 分钟切换当前状态的另一张图
function startCycle(){
  clearInterval(cycleTimer);
  cycleTimer = setInterval(tick, ROTATE_MS);
}

/* ---------- 状态条 ---------- */
const meterDefs = [
  {key:'wallet',   label:'💰钱包', color:'#f6c453', money:true},
  {key:'mood',     label:'😊心情', color:'#7ec8e3'},
  {key:'affinity', label:'💗好感', color:'#ff8aa0'},
];
meterDefs.forEach(m=>{
  const wrap=document.createElement('div'); wrap.className='meter';
  wrap.innerHTML=`<div class="lab"><span>${m.label}</span><span data-v></span></div>
    <div class="bar"><div class="fill" style="background:${m.color}"></div></div>`;
  $('#meters').appendChild(wrap);
  m._fill=wrap.querySelector('.fill'); m._v=wrap.querySelector('[data-v]');
});
/* 成就贴图定义（必须放在 paintMeters 首次调用之前，否则触发 TDZ：Cannot access 'BADGE_DEFS' before initialization） */
const BADGE_DEFS = [
  {th:80, file:'badge-bow.png',   title:'挚友喵：蝴蝶结贴图'},
  {th:50, file:'badge-hat.png',   title:'伙伴喵：礼帽贴图'},
  {th:25, file:'badge-scarf.png', title:'熟人喵：围巾贴图'},
];

function paintMeters(){
  meterDefs.forEach(m=>{
    if(m.money){ m._fill.style.width=walletLevel()+'%'; m._v.textContent='¥'+Math.round(stats.wallet); }
    else { const v=clamp(stats[m.key]); m._fill.style.width=v+'%'; m._v.textContent=Math.round(v); }
  });
  renderBadges();   // 好感变化 → 刷新成就贴图
}
paintMeters();
function notifyStats(){ if(window.__pet) window.__pet.notifyStats({wallet:stats.wallet, mood:stats.mood, affinity:stats.affinity, level:affinityLabel()}); }

/* ---------- 成就贴图：好感度里程碑解锁，贴在 GIF 左侧空白处（不穿戴） ---------- */
function renderBadges(){
  const b=$('#badges'); if(!b) return; b.innerHTML='';
  const a=stats.affinity;
  BADGE_DEFS.forEach(d=>{
    if(a>=d.th){
      const img=document.createElement('img');
      img.className='badge';
      img.src='assets/badges/'+d.file;

dragLayer.addEventListener('pointerdown', e=>{

  if(!window.__pet){ pet.style.left=e.clientX-ox+'px'; pet.style.top=e.clientY-oy+'px'; pet.style.transform='none'; }
  downTime=Date.now(); moved=false; lastDX=0;

/* =========================================================================

const TIME_PHASES = {
  morning:'brightness(1.03) saturate(1.06)',                       // 清晨：微亮
  noon:   'none',                                                  // 白天：原色
  evening:'sepia(.16) saturate(1.12) brightness(.98)',             // 傍晚：暖橙
  night:  'brightness(.9) hue-rotate(-10deg) saturate(1.1)',       // 夜晚：冷蓝
};
function phaseOf(h){ if(h>=5&&h<11) return 'morning'; if(h>=11&&h<17) return 'noon'; if(h>=17&&h<20) return 'evening'; return 'night'; }
function applyAmbiance(){
  const ph = phaseOf(new Date().getHours());
  pet.style.filter = TIME_PHASES[ph];
  // 节日彩蛋（固定阳历节日；春节为农历，未自动识别）
  const md = String(new Date().getMonth()+1).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0');
  const HL = {'01-01':'元旦快乐','02-14':'情人节快乐','05-01':'劳动节快乐','10-01':'国庆节快乐','12-25':'圣诞快乐'};
  if(HL[md] && lastHoliday!==md){
    lastHoliday = md; persist();
    showBanner('🎉 '+HL[md]+'！猫猫给你撒花花~', 4200);
    holidayConfetti();
  }
}
function holidayConfetti(){
  const box=$('#confetti'); const colors=['#ff8aa0','#7ec8e3','#ffd166','#7B9F76','#ffb347'];
  for(let i=0;i<36;i++){ const c=document.createElement('div'); c.className='confetti';
    c.style.left=(Math.random()*100)+'vw'; c.style.background=colors[i%colors.length];
    c.style.animation='confall '+(2+Math.random()*1.6)+'s linear forwards';
    c.style.animationDelay=(Math.random()*0.8)+'s';
    box.appendChild(c); setTimeout(()=>c.remove(),4200); }
}

/* =========================================================================
   低调省电模式：暂停换图轮播 / 后台循环，降低内存占用
   ========================================================================= */
function applyLowPower(on){
  lowPower = on; persist();
  if(on){
    clearInterval(cycleTimer); cycleTimer=null;     // 暂停换图
    if(decayTimer){ clearInterval(decayTimer); decayTimer=null; }
    if(quipTimer){ clearInterval(quipTimer); quipTimer=null; }
    if(tipsTimer){ clearInterval(tipsTimer); tipsTimer=null; }
    showBanner('🌙 低调模式：已省电（暂停换图与提醒）', 2600);
  } else {
    startCycle();      // 恢复换图
    startLoops();      // 恢复后台循环
    showBanner('✨ 已恢复正常模式', 2200);
  }
  if(window.__pet) window.__pet.notifyFlags({walking:walking, teaser:teaser, lowPower:lowPower});
}

/* =========================================================================
   开场白
   ========================================================================= */
if(!dead) setTimeout(()=>say('今天也要加油💪', 2200), 800);

/* =========================================================================
   Electron 专属钩子
   ========================================================================= */
if(window.__pet){
  window.__pet.onSetState(k=>setState(k));
  window.__pet.onSetAuto(()=>setAuto());
  window.__pet.onPat(()=>pat());
  window.__pet.onFeed(()=>feed());
  window.__pet.onPlay(()=>play());
  window.__pet.onPoke(()=>poke());
  window.__pet.onStartCatch(()=>startCatch());
  window.__pet.onSetMoving(setMoving);
  window.__pet.onSimulatePayday(()=>simulatePayday());
  window.__pet.onSniff(()=>sniff());
  window.__pet.onSetReminder(min=>applyReminder(min));
  window.__pet.onToggleLowPower(()=>applyLowPower(!lowPower));
  let dimmed=false;
  window.__pet.onDim(v=>{ pet.style.opacity=v; dimmed=(v<1); });
  document.addEventListener('mousemove', ()=>{ if(dimmed) window.__pet.hover(); });
  notifyStats();
  window.__pet.notifyFlags({walking:false, teaser:false, lowPower:lowPower});
}

/* 启动 */
if(dead){
  /* 死亡态：展示哭脸 + 横幅，等待用户点「重新投胎」清零重开（下次打开仍会显示，直到投胎） */
  try{ setItemByFile('060.gif'); }catch(e){}
  paintMeters();
  showDeadBanner();
  _log('INIT dead state shown');
} else {
  try {
    const firstItem = (typeof stateLists!=='undefined' && stateLists[currentState] && stateLists[currentState].length) ? pickNext(currentState)
                     : (typeof GIF_CATALOG!=='undefined' && GIF_CATALOG.length ? GIF_CATALOG[0] : null);
    if(firstItem) render(firstItem, "月薪喵来啦～");
    else { showDebug('❌ 没有可用 GIF（catalog/stateLists 为空），猫窗口空白。'); }
  } catch(err){ showDebug('启动渲染异常: '+(err&&err.stack||err)); }
  _log('INIT item='+(currentItem?currentItem.file:'NULL')+' state='+currentState+' src='+(currentItem?pathOf(currentItem.file):''));
  if(!lowPower) startCycle();
  startLoops();
  paintOffwork();
  applyAmbiance();
  setInterval(applyAmbiance, 60000);   // 每分钟检查昼夜/节日
  startHealthSchedule();              // 启动健康提醒（喝水30min/休息1h/夜间护眼，默认开启）
  checkDailyExpense();                // 每日生活开支结算（首启只记录日期，不立即扣）
  setInterval(checkDailyExpense, 60000);   // 每分钟检查跨天，自动扣生活开支
}
</script>
</body>
